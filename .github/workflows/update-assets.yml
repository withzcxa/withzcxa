name: Update Profile Assets (Snake + Bing Daily)

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Bing daily picture
        run: |
          mkdir -p assets
          JSON=$(curl -s "https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN")
          IMG_PATH=$(echo "$JSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['images'][0]['url'])")
          TITLE=$(echo "$JSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['images'][0].get('title',''))")
          curl -sL "https://www.bing.com${IMG_PATH}" -o assets/bing-daily.jpg
          echo "$TITLE" > assets/bing-title.txt
          ls -la assets/

      - name: Commit Bing picture as repo owner
        run: |
          git config user.name "withzcxa"
          git config user.email "withzcx@gmail.com"
          git add assets/bing-daily.jpg assets/bing-title.txt
          if git diff --cached --quiet; then
            echo "No changes today"
          else
            git commit -m "🖼️ Update Bing daily picture"
            git push
          fi

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
